body:
  text: 夫玄籍理融妙出淨言之表窮可聞難睹四覆育普救物出沒自由神變自在而名時有大比丘僧法師累行積因塵劫餘背塵境合寺僧眾威儀逮名經披攬演法未聞隨機頓漸逕救講寺契利帶浮自守應託閻浮人四葳齊等宿德本又是大士能以不足已抽有愍愚愛智率契道俗一百人等時以王氏磐根太原海內君積善空王高鑒自遠里人若歸中白玉石像一區舉高一仞釋迦當陽藥王文殊維摩大士乃重天人散華無事不有菩薩乘空百頂禮世謂希奇此土未有道俗可因此福力之冥上為皇帝方太然干戈不起龍雨順時涂常土豐民寧歸依正道海望英儒標心悟解上為七祖先靈永別苦因超昇淨土合邑官持寵現在常安不乏財有所同述心遐壽眷屬康延遠塵離蠢大齊河清三年二月八日合邑義靈碁磻礡神冑淵玄河天豪七冏八相花如獨朗秋蓮綿綿擾四生循環往返難平大覺翻榮人天盛顯地獄流明河客茲隨波遷寶隱洛簪依佛出離埃塵青蓮比淨德合境稱尊志在道門五教敷慧恒居一紀思念菩提長永傳名諱堪佛主王
